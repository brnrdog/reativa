<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96" width="340" height="96" role="img" aria-label="reativa">
  <title>reativa</title>
  <!-- Horizontal lockup for light backgrounds: the lattice mark plus the
       wordmark. Fonts are not embeddable in an <img>-rendered SVG, so the
       wordmark uses a geometric-sans stack with generic fallbacks. -->
  <g transform="translate(8 16) scale(2.6667)">
    <g fill="#1a1a17" opacity="0.3">
      <circle cx="5" cy="12" r="1.7" />
      <circle cx="5" cy="19" r="1.7" />
      <circle cx="12" cy="19" r="1.7" />
      <circle cx="19" cy="5" r="1.7" />
      <circle cx="12" cy="5" r="1.7" />
      <circle cx="19" cy="12" r="1.7" />
    </g>
    <g fill="#8578b8">
      <circle cx="5" cy="5" r="2.2" />
      <circle cx="12" cy="12" r="2.2" />
      <circle cx="19" cy="19" r="2.2" />
    </g>
  </g>
  <text
    x="88"
    y="65"
    fill="#1a1a17"
    font-family="'Space Grotesk', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="48"
    font-weight="700"
    letter-spacing="-1.4"
  >reativa</text>
</svg>
