name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.x"

      - name: Install npm dependencies
        run: npm ci

      - name: Install opam dependencies
        run: opam install . --deps-only --with-test

      # Analytics is wired in only when a PostHog project key is configured.
      # It is a public, write-only client key, so either a secret or a
      # repository variable works — read both, since they are separate contexts.
      - name: Build site
        env:
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY || vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST || vars.POSTHOG_HOST }}
        run: npm run docs:build

      # A missing key is not a build failure — that is how forks build — but it
      # is worth a warning, since the symptom is a site that reports nothing.
      - name: Report analytics wiring
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY || vars.POSTHOG_KEY }}
        run: |
          if [ -z "$POSTHOG_KEY" ]; then
            echo "::warning::No PostHog key (POSTHOG_KEY secret or variable) — the site was built without analytics."
          elif ls _site/assets | grep -q '^module-'; then
            echo "PostHog key present, SDK chunk emitted — analytics enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::PostHog key was set but no SDK chunk was emitted."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
