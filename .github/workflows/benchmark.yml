name: Benchmark

# Opt-in via the `benchmark` label. The suite builds the library twice (this
# PR and its base) on both backends and drives a browser for several minutes,
# and its timings only mean anything for changes that touch rendering — so it
# stays off unless a PR asks for it.
#
# It lives outside ci.yml so that reacting to `labeled` does not re-run the
# whole test job every time any label is touched.

on:
  pull_request:
    branches: [main, rc]
    # `labeled` is what lets an already-open PR opt in without a new push.
    types: [opened, synchronize, reopened, labeled]
  # A full run across Reativa (both backends), xote and SolidJS, uploaded as an
  # artifact.
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          opam install . --deps-only
          opam install melange js_of_ocaml js_of_ocaml-compiler
          npm --prefix benchmarks install
          (cd benchmarks && npx playwright install --with-deps chromium)

      - name: Build and run
        run: |
          node benchmarks/build.mjs
          node benchmarks/driver.mjs
          node benchmarks/dom-ops.mjs --json benchmarks/results/dom-ops.json > benchmarks/results/dom-ops.txt

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/

  benchmark:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      (github.event.action != 'labeled' || github.event.label.name == 'benchmark')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          opam install . --deps-only
          opam install melange js_of_ocaml js_of_ocaml-compiler
          npm --prefix benchmarks install
          (cd benchmarks && npx playwright install --with-deps chromium)

      - name: Build PR benchmark apps
        run: node benchmarks/build.mjs --apps reativa,reativa-jsoo

      # The benchmark app source always comes from the PR, so both builds run
      # identical application code and only the library differs.
      - name: Build base benchmark apps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="$(mktemp -d)"
          cleanup() {
            git worktree remove "$base_dir" --force || true
            rm -rf "$base_dir"
          }
          trap cleanup EXIT

          git worktree add --detach "$base_dir" "$BASE_SHA"
          rm -rf "$base_dir/benchmarks"
          mkdir -p "$base_dir/benchmarks"
          tar --exclude=node_modules --exclude=dist -cf - -C benchmarks . | tar -xf - -C "$base_dir/benchmarks"

          node benchmarks/build.mjs --apps reativa --root "$base_dir" --as reativa-base
          node benchmarks/build.mjs --apps reativa-jsoo --root "$base_dir" --as reativa-jsoo-base

      - name: Run benchmark
        env:
          BENCH_VERSION_reativa_base: ${{ github.base_ref }}
          BENCH_VERSION_reativa_jsoo_base: ${{ github.base_ref }}
        run: |
          apps=reativa,reativa-base,reativa-jsoo,reativa-jsoo-base
          node benchmarks/driver.mjs --apps "$apps" --iterations 10 --warmup 3 \
            --out benchmarks/ci-results
          node benchmarks/dom-ops.mjs --apps "$apps" --json benchmarks/ci-results/dom-ops.json

      - name: Generate benchmark report
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          node scripts/benchmark-report.mjs \
            --results benchmarks/ci-results/results.json \
            --dom-ops benchmarks/ci-results/dom-ops.json \
            --baseline-label "$BASE_REF" \
            --current-label PR

      - name: Comment benchmark on PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_FILE: benchmark-report.md
        run: |
          marker="<!-- reativa-benchmark-report -->"
          body_file="$(mktemp)"
          {
            echo "$marker"
            cat "$COMMENT_FILE"
          } > "$body_file"

          comment_id="$(
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$marker\")) | .id" \
              | head -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" \
              -f body="$(cat "$body_file")"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="$(cat "$body_file")"
          fi
