<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>reativa - js_of_ocaml todo demo</title>
        <style>
            :root {
                --ink: oklch(20% 0.018 255);
                --paper: oklch(98% 0.006 255);
                --line: oklch(88% 0.012 255);
                --wash: oklch(94% 0.01 255);
                --muted: oklch(47% 0.015 255);
            }

            body {
                margin: 0;
                min-height: 100vh;
                background: var(--paper);
                color: var(--ink);
                font: 15px/1.5 system-ui, sans-serif;
            }

            .todo-shell {
                margin: 3rem auto;
                max-width: 36rem;
                padding: 1.5rem;
                border: 1px solid var(--line);
                border-radius: 1rem;
                background: #fff;
            }

            .todo-title {
                margin: 0;
                font-size: 1.5rem;
            }

            .todo-copy {
                margin: 0.5rem 0 0;
                color: var(--muted);
                font-size: 0.875rem;
            }

            .todo-composer {
                display: flex;
                gap: 0.5rem;
                margin-top: 1.5rem;
            }

            .todo-input {
                flex: 1;
                min-width: 0;
                padding: 0.6rem 0.75rem;
                border: 1px solid var(--line);
                border-radius: 0.5rem;
                background: var(--paper);
                font: inherit;
            }

            .todo-action,
            .todo-filters button {
                padding: 0.6rem 1rem;
                border: 1px solid var(--line);
                border-radius: 0.5rem;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }

            .todo-action {
                border-color: var(--ink);
                background: var(--ink);
                color: var(--paper);
            }

            .todo-filters button {
                background: var(--paper);
                color: var(--ink);
            }

            .todo-list {
                margin: 1.5rem 0;
                padding: 0;
                list-style: none;
            }

            .todo {
                display: flex;
                align-items: center;
                margin-bottom: 0.5rem;
                padding: 0.65rem 0.75rem;
                border: 1px solid var(--line);
                border-radius: 0.75rem;
                background: var(--paper);
            }

            .todo-label {
                display: flex;
                flex: 1;
                align-items: center;
                gap: 0.75rem;
            }

            .todo:has(.todo-checkbox:checked) {
                background: var(--wash);
            }

            .todo:has(.todo-checkbox:checked) .todo-title-text {
                color: var(--muted);
                text-decoration: line-through;
            }

            .todo-filters {
                display: flex;
                justify-content: center;
                gap: 0.5rem;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>

        <!--
          Built by `npm run demo:jsoo`. A plain <script>, not a module:
          js_of_ocaml links the OCaml runtime and every module into one
          self-contained file, so there is no bundler step.
        -->
        <script src="./todo.bundle.js"></script>
    </body>
</html>
